name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22.0"
          cache: true
      - name: Check formatting
        run: make fmt-check
      - name: Test
        run: make test
      - name: Vet
        run: make vet
      - name: Build standalone analyzer
        run: make build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
